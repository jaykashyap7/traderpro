name: Build TraderPro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www assets && cp index.html www/ && cp icon.png assets/icon.png
      - run: npx cap add android
      - name: Add widget and backup code
        run: |
          mkdir -p "android/app/src/main/java/com/peaky/journal"
          cat > "android/app/src/main/java/com/peaky/journal/MainActivity.java" <<'PEAKYEOF'
          package com.peaky.journal;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PeakyWidgetPlugin.class);
              registerPlugin(PeakyBackupPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          PEAKYEOF
          mkdir -p "android/app/src/main/java/com/peaky/journal"
          cat > "android/app/src/main/java/com/peaky/journal/PeakyWidgetPlugin.java" <<'PEAKYEOF'
          package com.peaky.journal;

          import android.content.Context;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PeakyWidget")
          public class PeakyWidgetPlugin extends Plugin {
            @PluginMethod
            public void update(PluginCall call) {
              Context c = getContext();
              String text = call.getString("text", "");
              String date = call.getString("date", "");
              c.getSharedPreferences("peaky", Context.MODE_PRIVATE).edit().putString("text", text).putString("date", date).apply();
              PeakyWidget.refresh(c);
              call.resolve();
            }
          }
          PEAKYEOF
          mkdir -p "android/app/src/main/java/com/peaky/journal"
          cat > "android/app/src/main/java/com/peaky/journal/PeakyWidget.java" <<'PEAKYEOF'
          package com.peaky.journal;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class PeakyWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) m.updateAppWidget(id, build(c));
            }

            static RemoteViews build(Context c) {
              SharedPreferences p = c.getSharedPreferences("peaky", Context.MODE_PRIVATE);
              String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
              String text = p.getString("text", "");
              String date = p.getString("date", "");
              if (!today.equals(date) || text.isEmpty()) {
                text = "No plan for today yet.\nTap to write your rule, target and R:R.";
              }
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.peaky_widget);
              v.setTextViewText(R.id.wtext, text);
              Intent i = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              PendingIntent pi = PendingIntent.getActivity(c, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              v.setOnClickPendingIntent(R.id.wroot, pi);
              return v;
            }

            static void refresh(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              int[] ids = m.getAppWidgetIds(new ComponentName(c, PeakyWidget.class));
              for (int id : ids) m.updateAppWidget(id, build(c));
            }
          }
          PEAKYEOF
          mkdir -p "android/app/src/main/java/com/peaky/journal"
          cat > "android/app/src/main/java/com/peaky/journal/PeakyBackupPlugin.java" <<'PEAKYEOF'
          package com.peaky.journal;

          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "PeakyBackup")
          public class PeakyBackupPlugin extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              String name = call.getString("name");
              String data = call.getString("data");
              if (name == null || data == null) { call.reject("Missing data"); return; }
              if (Build.VERSION.SDK_INT < 29) { call.reject("Needs Android 10 or newer"); return; }
              try {
                ContentResolver r = getContext().getContentResolver();
                Uri coll = MediaStore.Files.getContentUri("external");
                String rel = Environment.DIRECTORY_DOCUMENTS + "/TraderPro/";
                Uri uri = null;
                String sel = MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?";
                Cursor cur = r.query(coll, new String[]{MediaStore.MediaColumns._ID}, sel, new String[]{name, rel}, null);
                if (cur != null) {
                  if (cur.moveToFirst()) uri = ContentUris.withAppendedId(coll, cur.getLong(0));
                  cur.close();
                }
                if (uri == null) {
                  ContentValues cv = new ContentValues();
                  cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                  cv.put(MediaStore.MediaColumns.RELATIVE_PATH, rel);
                  uri = r.insert(coll, cv);
                }
                if (uri == null) { call.reject("Could not create file"); return; }
                OutputStream os = r.openOutputStream(uri, "wt");
                if (os == null) { call.reject("Could not open file"); return; }
                os.write(data.getBytes(StandardCharsets.UTF_8));
                os.close();
                Cursor c2 = r.query(coll, new String[]{MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DISPLAY_NAME},
                    MediaStore.MediaColumns.RELATIVE_PATH + "=? AND " + MediaStore.MediaColumns.DISPLAY_NAME + " LIKE ?",
                    new String[]{rel, "TraderPro_Backup_%"}, MediaStore.MediaColumns.DISPLAY_NAME + " DESC");
                if (c2 != null) {
                  int n = 0;
                  while (c2.moveToNext()) {
                    if (++n > 10) r.delete(ContentUris.withAppendedId(coll, c2.getLong(0)), null, null);
                  }
                  c2.close();
                }
                JSObject o = new JSObject();
                o.put("path", "Documents/TraderPro/" + name);
                call.resolve(o);
              } catch (Exception e) {
                call.reject(e.getMessage() == null ? "Backup error" : e.getMessage());
              }
            }
          }
          PEAKYEOF
          mkdir -p "android/app/src/main/res/layout"
          cat > "android/app/src/main/res/layout/peaky_widget.xml" <<'PEAKYEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/wroot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="TraderPro · Today's plan"
                  android:textColor="#FF2F45"
                  android:textSize="12sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wtext"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:maxLines="9"
                  android:ellipsize="end"
                  android:textColor="#E8ECF1"
                  android:textSize="14sp" />
          </LinearLayout>
          PEAKYEOF
          mkdir -p "android/app/src/main/res/drawable"
          cat > "android/app/src/main/res/drawable/widget_bg.xml" <<'PEAKYEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#EE0A0A0D" />
              <stroke android:width="1dp" android:color="#55FF2F45" />
              <corners android:radius="20dp" />
          </shape>
          PEAKYEOF
          mkdir -p "android/app/src/main/res/xml"
          cat > "android/app/src/main/res/xml/peaky_widget_info.xml" <<'PEAKYEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/peaky_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          PEAKYEOF
      - name: Patch manifest and version
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          rec='<receiver android:name=".PeakyWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/peaky_widget_info"/></receiver>'
          perms='<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/>'
          assert '</application>' in s
          s=s.replace('</application>',rec+'</application>',1).replace('</manifest>',perms+'</manifest>',1)
          open(p,'w').write(s)
          g='android/app/build.gradle'
          t=open(g).read()
          t=t.replace('versionCode 1','versionCode '+str(int(__import__('time').time()//60)),1)
          open(g,'w').write(t)
          PY
        env:
          RUN_NO: ${{ github.run_number }}
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0d1014' --iconBackgroundColorDark '#0d1014' || true
      - run: npx cap sync android
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TraderPro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TraderPro v${{ github.run_number }}
          files: TraderPro.apk
          
