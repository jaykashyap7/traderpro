:root{color-scheme:light;--bg:#f1f1f4;--card:rgba(255,255,255,.72);--card2:#fff;--sheet:rgba(250,250,252,.93);--nav:rgba(255,255,255,.8);--tx:#0b0b0e;--mu:#6a6a76;--bd:rgba(11,11,14,.09);--chip:rgba(11,11,14,.06);--inp:rgba(11,11,14,.045);--ac:#e10f2d;--acs:rgba(225,15,45,.13);--acg:rgba(225,15,45,.38);--w:#0f8f5b;--l:#d7283a;--b:#ad7b00;--al:#2b78cf;--ap:#dc7317;--sh:0 12px 32px -14px rgba(11,11,14,.2);--bgi:radial-gradient(720px 440px at 100% -8%,rgba(225,15,45,.11),transparent 62%),radial-gradient(620px 440px at -14% 40%,rgba(11,11,14,.06),transparent 64%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);accent-color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#060608;--card:rgba(255,255,255,.058);--card2:#141418;--sheet:rgba(15,15,19,.93);--nav:rgba(9,9,12,.8);--tx:#f5f5f7;--mu:#9b9ba8;--bd:rgba(255,255,255,.09);--chip:rgba(255,255,255,.08);--inp:rgba(255,255,255,.06);--ac:#ff2f45;--acs:rgba(255,47,69,.17);--acg:rgba(255,47,69,.5);--w:#31d08f;--l:#ff5b69;--b:#e8c34c;--al:#5ba8f2;--ap:#f29438;--sh:0 16px 38px -16px rgba(0,0,0,.75);--bgi:radial-gradient(720px 460px at 100% -8%,rgba(255,47,69,.18),transparent 62%),radial-gradient(560px 420px at -14% 42%,rgba(255,255,255,.045),transparent 64%)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#060608;--card:rgba(255,255,255,.058);--card2:#141418;--sheet:rgba(15,15,19,.93);--nav:rgba(9,9,12,.8);--tx:#f5f5f7;--mu:#9b9ba8;--bd:rgba(255,255,255,.09);--chip:rgba(255,255,255,.08);--inp:rgba(255,255,255,.06);--ac:#ff2f45;--acs:rgba(255,47,69,.17);--acg:rgba(255,47,69,.5);--w:#31d08f;--l:#ff5b69;--b:#e8c34c;--al:#5ba8f2;--ap:#f29438;--sh:0 16px 38px -16px rgba(0,0,0,.75);--bgi:radial-gradient(720px 460px at 100% -8%,rgba(255,47,69,.18),transparent 62%),radial-gradient(560px 420px at -14% 42%,rgba(255,255,255,.045),transparent 64%)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background-color:var(--bg)}body{background-image:var(--bgi);background-repeat:no-repeat;color:var(--tx);font:500 14px/1.45 Inter,system-ui,-apple-system,Roboto,sans-serif;letter-spacing:-.005em;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:'kern','cv11'}
button,input,select,textarea{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:auto}
header.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.ib{width:42px;height:42px;padding:0!important;display:grid;place-items:center;border-radius:14px!important}.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 108px;scroll-behavior:smooth}
main.enter{animation:enter .3s cubic-bezier(.2,.85,.25,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
h1{font-size:13px;color:var(--mu);font-weight:600}h2{font-size:15px;font-weight:800;margin:24px 0 10px;letter-spacing:-.015em}
.big{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.08;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:15px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.card.item{-webkit-backdrop-filter:none;backdrop-filter:none;transition:transform .15s,border-color .2s}.card.item:active{transform:scale(.985)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.g2{grid-template-columns:repeat(2,1fr)}
.k{font-size:11.5px;color:var(--mu)}.v{font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
b{font-variant-numeric:tabular-nums}
.w{color:var(--w)}.l{color:var(--l)}.be{color:var(--b)}.al{color:var(--al)}.ap{color:var(--ap)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:flex;background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-top:1px solid var(--bd);padding:7px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;min-width:0;position:relative;background:none;border:0;color:var(--mu);font:600 10.5px Inter,sans-serif;padding:5px 0 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.2,.85,.25,1)}
nav button::before{content:'';position:absolute;top:-7px;left:50%;width:0;height:3px;border-radius:0 0 4px 4px;background:var(--ac);transform:translateX(-50%);transition:width .28s cubic-bezier(.2,.85,.25,1);box-shadow:0 2px 10px var(--acg)}
nav button.on{color:var(--ac)}nav button.on::before{width:24px}nav button.on svg{stroke-width:2.2;transform:translateY(-1px)}
.bdg{position:absolute;top:0;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--ac);color:#fff;font:800 9.5px/16px Inter,sans-serif;font-style:normal;text-align:center}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--ac);color:#fff;font:800 14px Inter,sans-serif;letter-spacing:-.01em;cursor:pointer;z-index:5;box-shadow:0 12px 28px -8px var(--acg),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s}#fab:active{transform:scale(.95)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--tx);display:inline-block;margin:2px 4px 2px 0;transition:background .2s,color .2s,transform .12s}
.chip.on{background:var(--ac);color:#fff}
.item{display:block;width:100%;text-align:left;margin-bottom:9px;cursor:pointer;color:inherit;font:inherit}
input,select,textarea{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:13px;padding:11px 12px;font:600 15px Inter,sans-serif;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}textarea{min-height:76px;resize:vertical;font-weight:500}
input::placeholder,textarea::placeholder{color:var(--mu);font-weight:500;opacity:.75}
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin:11px 0 5px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:13px;padding:10px 15px;font:700 13px Inter,sans-serif;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}.btn:active{transform:scale(.96)}
.btn.p{background:var(--ac);color:#fff;border:0;box-shadow:0 10px 22px -10px var(--acg),inset 0 1px 0 rgba(255,255,255,.22)}.btn.d{color:var(--l)}
.lnk{display:block;margin:10px 0 0;background:none;border:0;color:var(--ac);font:700 13px Inter,sans-serif;padding:0;text-align:left;cursor:pointer}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sh.on{display:flex;animation:fade .22s}
#sh>div{background:var(--sheet);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--bd);border-bottom:0;width:100%;max-width:760px;max-height:93%;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:24px 16px 0;animation:up .34s cubic-bezier(.2,.85,.25,1)}
#sh>div::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--bd);margin:-14px auto 14px}
#shc::after{content:'';display:block;height:calc(26px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(46px);opacity:0}}@keyframes fade{from{opacity:0}}
.sbar{position:sticky;bottom:0;margin:16px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--sheet) 72%,transparent)}
.sec{display:flex;align-items:center;gap:9px;margin:26px 0 4px;font-size:14px;font-weight:800;letter-spacing:-.015em}.sec::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border-bottom:0}.kv>span:last-child{text-align:right;font-weight:600;white-space:pre-wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cd{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--chip);padding:4px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer;text-align:left;position:relative;overflow:hidden;transition:transform .12s}.cd:active{transform:scale(.94)}
.cd b{display:block;font-size:11px;margin-top:2px;letter-spacing:-.3px}.cd.sel{outline:2px solid var(--tx)}
.dot{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%}
.seg{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.seg .chip{flex:0 0 auto;height:34px;display:inline-flex;align-items:center;margin:0;padding:0 14px;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;border-radius:17px;cursor:pointer}.seg::-webkit-scrollbar{display:none}
.seg.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}.seg .chip:active{transform:scale(.95)}
.bar{height:6px;border-radius:3px;margin-top:5px;transition:width .5s cubic-bezier(.2,.85,.25,1)}.trk{height:6px;border-radius:3px;background:var(--chip);margin-top:6px}.trk .bar{margin:0}

 const ck=t.ck&&t.ck.length?`<div style="margin-top:6px">${t.ck.map(c=>`<div class="chk" style="padding:3px 0"><b style="color:var(--${c[1]?'w':'l'});width:22px;text-align:center">${c[1]?'✓':'✕'}</b><span>${esc(c[0])}</span></div>`).join('')}</div>`:'';
 const o=[];
 o.push(sec('Strategy',kv('Strategy',t.strat)+kv('Entry module',t.mod)+(t.ckPct!=null?kv('Confirmation',t.ckPct+'% · '+vld(t.ckPct)):'')+ck));
